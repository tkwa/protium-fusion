 <g font-size="17"><text x="1000" y="204" font-weight="700">100 nm continuous cap</text><text x="1000" y="230">Hot irradiated sealing is an</text><text x="1000" y="252">acceptance requirement.</text><path d="M985 205H962" stroke="#43505b"/>
 <text x="1000" y="293" font-weight="700">150 µm aligned graphite</text><text x="1000" y="318">100 nm buried slits, 20 µm pitch</text><text x="1000" y="340">Nominal primary range ≤90 µm</text><path d="M985 299H963" stroke="#43505b"/>
