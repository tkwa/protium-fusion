<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc">
<title id="title">✨ Candidate catcher tile: separate heat, gas and material circuits</title>
<desc id="desc">Schematic cross-section, not to scale. Fast ions enter a capped graphite stopping laminate. Buried slits feed a sealed plenum, which has graphite heat posts and offset gas vias through the backing. A separate sealed working-fluid circuit removes heat. Gas and retained solids go to separate collection and regeneration equipment.</desc>
